server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html, app.js, style.css and the programme files carry NO content
    # hash in their names, so an immutable cache would pin visitors to a stale
    # build after every deploy. Revalidate them instead - they are a few tens of
    # kB and ETag makes the check cheap.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Genuinely static assets may be cached hard.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
