---
# Attaches to the shared traefik-gateway, which has no hostname restriction on
# its listeners, so this matches purely on Host.
#
# TLS terminates at Traefik with a cert-manager certificate. This hostname must
# also be listed in the `gateway-tls-public` Certificate in homelab-infra
# (infrastructure/cert-manager/gateway-certs.yaml) or the TLS handshake fails.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eth-planner
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - eth-planner.sthomas.ch
  rules:
    - backendRefs:
        - name: eth-planner
          port: 80
