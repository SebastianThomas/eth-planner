name: Docker Build & Push
description: Builds the Docker image and pushes it to Docker Hub with the given tags.

inputs:
  image-name:
    description: Full image name, e.g. myuser/myimage
    required: true
  tags:
    description: Newline-separated list of tags (passed directly to docker/metadata-action)
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-token:
    description: Docker Hub access token
    required: true

runs:
  using: composite
  steps:
    # Required to build the arm64 layer on an amd64 runner - buildx alone does
    # not register the binfmt handlers.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image-name }}
        tags: ${{ inputs.tags }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        # Multi-arch so the image also runs on the arm64 worker node. The arm64
        # build runs under emulation, so this stage is slower.
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
