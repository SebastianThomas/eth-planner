name: deploy
run-name: "deploy prod @ ${{ inputs.tag || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}"

# Prod is the only environment. Two ways in:
#
#   push of a calver tag  -> deploys automatically, but ONLY if the tag is a
#                            final release and is reachable from main. A
#                            pre-release tag (v2026.0.16-rc.1) or a tag off a
#                            side branch is SKIPPED, not failed - tagging an rc
#                            is a normal thing to do and should not go red.
#
#   Run workflow (manual) -> deploys whatever tag you name, pre-release
#                            included. This is the deliberate override path, so
#                            it trusts you and only warns in the log about
#                            whatever is unusual about the tag.
#
# The tag filter below is a glob, so `[0-9]*` also matches `16-rc.1`; the
# pre-release check therefore has to happen in the gate, not in the filter.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and deploy (pre-release tags are allowed here)
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      ref: ${{ steps.check.outputs.ref }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - id: check
        env:
          REF: ${{ inputs.tag || github.ref_name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

          # A pre-release tag carries a hyphen after the version: v2026.0.16-rc.1
          prerelease=false
          case "$REF" in *-*) prerelease=true ;; esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          on_main=false
          git fetch origin main --quiet
          if git merge-base --is-ancestor HEAD origin/main; then on_main=true; fi

          echo "tag=$REF prerelease=$prerelease reachable-from-main=$on_main manual=$MANUAL"

          if [ "$MANUAL" = true ]; then
            # Deliberate run: ship it, but make anything unusual visible.
            if [ "$prerelease" = true ]; then
              echo "::warning::$REF is a pre-release - deploying to prod because this run is manual"
            fi
            if [ "$on_main" = false ]; then
              echo "::warning::$REF is not reachable from main - deploying to prod anyway because this run is manual"
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Automatic run: strict, and skip quietly rather than failing.
          if [ "$prerelease" = true ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF is a pre-release - not auto-deploying. Use Run workflow to ship it."
            exit 0
          fi
          if [ "$on_main" = false ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF is not reachable from main - not auto-deploying."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  lint-build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/lint-build.yml

  build:
    needs: [gate, lint-build]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Build & push
        uses: ./.github/actions/docker-build-push
        with:
          image-name: ${{ secrets.DOCKERHUB_USERNAME }}/eth-planner
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          # `latest` must keep pointing at the newest FINAL release - a manual
          # pre-release deploy tags only its own version.
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.gate.outputs.prerelease == 'false' }}

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Image ref
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/eth-planner:${VERSION}" >> "$GITHUB_ENV"

      - uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01

      - uses: SebastianThomas/homelab-actions/kube-deploy@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: eth-planner-prod
          manifests: deploy/prod
          rollout: deployment/eth-planner
          image: ${{ env.IMAGE }}
